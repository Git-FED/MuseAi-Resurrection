<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07070a"><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/images/favicon.ico"><title>Terms — Muse-Ex Machina</title><style>:root{--bg:#07070a;--fg:#f5f5f7;--muted:#9a9aa8;--cyan:#00f0ff;--violet:#7000ff;--pink:#ff69b4;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.14)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,sans-serif}a{color:var(--cyan);text-decoration:none}.wrap{width:min(1120px,92vw);margin:auto}.nav{position:sticky;top:0;z-index:5;background:rgba(7,7,10,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.navin{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.brand{font-weight:800;letter-spacing:.02em}.hero{min-height:78vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.aurora{position:absolute;inset:-20%;z-index:-1;opacity:.7;filter:blur(28px);background:radial-gradient(35% 30% at 25% 35%,#00f0ff55,transparent 70%),radial-gradient(40% 35% at 78% 65%,#7000ff66,transparent 70%),radial-gradient(30% 25% at 55% 20%,#ff69b444,transparent 70%);animation:drift 10s ease-in-out infinite alternate;will-change:transform}@keyframes drift{from{transform:translate3d(-6%,-3%,0) scale(1)}to{transform:translate3d(6%,4%,0) scale(1.1)}}h1{font-size:clamp(2.5rem,8vw,6rem);line-height:1.02;margin:.4em 0;background:linear-gradient(120deg,#fff,var(--cyan),var(--violet));-webkit-background-clip:text;color:transparent}.lede{max-width:680px;margin:auto;color:var(--muted);font-size:1.15rem}.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:1px solid var(--border);color:var(--fg);background:var(--glass)}.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));border:0}.section{padding:72px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--glass);transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-4px);border-color:var(--cyan)}.muted{color:var(--muted)}pre{overflow:auto;padding:18px;border-radius:12px;background:#0d0d14;border:1px solid var(--border)}footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="wrap section"><h1>Terms</h1><p class="muted">This static page makes no claim of continuous agent identity. See <a href="index.html">the project home</a>.</p></main></body></html>
